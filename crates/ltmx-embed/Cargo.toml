[package]
name = "ltmx-embed"
description = "Text embedding adapters for ltmx."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Embeds via a local Ollama server (`nomic-embed-text`, 768 dimensions).
ollama = ["dep:serde", "dep:serde_json"]

[dependencies]
ltmx-domain.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true