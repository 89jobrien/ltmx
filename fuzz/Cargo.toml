[package]
name = "ltmx-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ltmx-sources = { path = "../crates/ltmx-sources", features = ["claude-transcripts"] }
tempfile = "3"

[[bin]]
name = "parse_transcript"
path = "fuzz_targets/parse_transcript.rs"
test = false
doc = false
bench = false